# Motory – zverejnenie stránok motorov (projektargo.com/<slug>/)
# Stránky pripravuje naplánovaná úloha „Motory – spúšťač“ a ukladá ich do Supabase (tabuľka motor_pages).
# Tento workflow ich zverejní hneď po zápise (signál zo Supabase), po každom zverejnení webu a záložne podľa rozvrhu. Nikdy nič nemaže.
name: Motory – zverejnenie stránok

on:
  schedule:
    # mimo celých hodín – GitHub plánované behy okolo :00 zdržiava alebo vynecháva
    - cron: "4,14,24,34,44,54 * * * *"
  push:
    branches: [main]
  repository_dispatch:
    types: [motory]   # signál zo Supabase hneď po zápise stránky do motor_pages
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pripnuté na commit, nie na pohyblivý tag: prepísaný tag v7 by inak získal právo
      # zápisu do repozitára. Aktualizácia: git ls-remote https://github.com/actions/checkout refs/tags/v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          ref: main
          fetch-depth: 1

      - name: Stiahnuť stránky motorov zo Supabase
        run: |
          python3 .github/motory_sync.py \
            --changed-out "$RUNNER_TEMP/motory-changed.txt" \
            --fail-out "$RUNNER_TEMP/motory-fail.txt"

      - name: Zverejniť zmeny (len ak nejaké sú)
        run: |
          if [ ! -s "$RUNNER_TEMP/motory-changed.txt" ]; then echo "Bez zmien."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs -d '\n' -a "$RUNNER_TEMP/motory-changed.txt" git add --
          git commit -m "Motory: zverejnenie stránok motorov"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "GitHub má novšie zmeny, preberám ich a skúšam znova ($i/3)…"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      # Až na konci, aby zamietnutá stránka nezabránila zverejneniu ostatných.
      # Beh musí skončiť chybou, inak by porucha ostala len v logu a e-mail by neprišiel.
      - name: Nahlásiť stránky zamietnuté pre CSP
        if: always()
        run: |
          f="$RUNNER_TEMP/motory-fail.txt"
          if [ -s "$f" ]; then
            echo "Tieto stránky by vlastná CSP rozbila, preto sa nezverejnili:"
            cat "$f"
            exit 1
          fi
          echo "Žiadna stránka zamietnutá pre CSP."
